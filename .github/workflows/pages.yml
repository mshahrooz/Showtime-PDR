name: Publish Showtime PDR to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'components/**'
      - 'scripts/build_site.py'
      - 'scripts/prepare_hero_video.sh'
      - '.github/workflows/pages.yml'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore optimized hero media from build cache
        uses: actions/cache@v4
        with:
          path: assets/hero-media
          key: showtime-hero-4281335-v2
      - name: Prepare compressed responsive background video
        run: bash scripts/prepare_hero_video.sh
      - name: Build six pages with shared components
        run: python3 scripts/build_site.py
      - name: Validate theme JavaScript and all six generated pages
        run: |
          node --check assets/theme-customizer.js
          python3 -m py_compile scripts/build_site.py
          for page in index.html about.html services.html gallery.html reviews.html contact.html; do
            test -f "_site/$page"
            grep -q 'data-theme-customizer' "_site/$page"
            grep -q 'assets/theme-customizer.js' "_site/$page"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow deployment artifact to register
        run: sleep 8
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
